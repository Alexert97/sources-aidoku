name: Build personal MangaWorld
on:
  push:
    branches:
      - personal-mangaworld-v7
  workflow_dispatch:

concurrency:
  group: personal-mangaworld
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: JSON formatting
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            jq empty "$file"
            if [[ -s "$file" && -n "$(tail -c 1 "$file")" ]]; then
              echo "::error file=$file::Missing final newline"
              exit 1
            fi
            if grep -nE $'^\t* +' "$file"; then
              echo "::error file=$file::Use tabs for indentation"
              exit 1
            fi
          done < <(find sources/it.mangaworld/res -type f -name '*.json' -print0)
      - name: Rust formatting and Clippy
        run: |
          set -euo pipefail
          for crate in sources/it.mangaworld templates/mangaworld; do
            (
              cd "$crate"
              cargo fmt
              cargo fmt --check
              cargo clippy --target wasm32-unknown-unknown -- -D warnings
            )
          done
      - name: Save formatting changes for final commit
        if: always()
        run: git diff -- sources/it.mangaworld templates/mangaworld > "${RUNNER_TEMP}/mangaworld-format.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mangaworld-format-patch
          path: ${{ runner.temp }}/mangaworld-format.patch
      - uses: ./.github/actions/install-aidoku-cli
        id: aidoku
      - name: Install native test runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libssl-dev libclang-dev
          pkg-config --modversion fontconfig
      - name: Cache Aidoku test runner
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aidoku-test-runner
          key: aidoku-test-runner-${{ runner.os }}-${{ runner.arch }}-${{ steps.aidoku.outputs.revision }}-rust1.99.0
      - name: Install Aidoku test runner
        env:
          AIDOKU_REVISION: ${{ steps.aidoku.outputs.revision }}
        run: |
          if ! command -v aidoku-test-runner >/dev/null; then
            cargo install --git https://github.com/Aidoku/aidoku-rs --rev "$AIDOKU_REVISION" aidoku-test-runner
          fi
      - name: Run live integration tests
        working-directory: sources/it.mangaworld
        run: cargo test
      - name: Package MangaWorld
        env:
          RUSTFLAGS: -Dwarnings
        working-directory: sources/it.mangaworld
        run: aidoku package
      - name: Build personal source list
        run: aidoku build sources/it.mangaworld/package.aix --name "Personal MangaWorld"
      - name: Fix personal website links
        run: |
          sed -i 's|https://aidoku-community.github.io/sources/|https://alexert97.github.io/sources-aidoku/|g; s|https://github.com/aidoku-community/sources|https://github.com/Alexert97/sources-aidoku|g; s|Aidoku Community Sources|Personal MangaWorld|g' public/index.html
      - name: Verify package
        run: aidoku verify sources/it.mangaworld/package.aix
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: mangaworld-v10
          path: sources/it.mangaworld/package.aix
          if-no-files-found: error
      - name: Publish source list
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: public
          single-commit: true
