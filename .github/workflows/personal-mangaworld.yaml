name: Build personal MangaWorld v9
on:
  push:
    branches:
      - personal-mangaworld-v7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/install-aidoku-cli
        id: aidoku
      - name: Install native test runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libssl-dev libclang-dev
          pkg-config --modversion fontconfig
      - name: Install Aidoku test runner
        env:
          AIDOKU_REVISION: ${{ steps.aidoku.outputs.revision }}
        run: cargo install --git https://github.com/Aidoku/aidoku-rs --rev "$AIDOKU_REVISION" aidoku-test-runner
      - name: Run live integration tests
        working-directory: sources/it.mangaworld
        run: cargo test
      - name: Format Rust
        working-directory: sources/it.mangaworld
        run: cargo fmt --check || cargo fmt
      - name: Package MangaWorld
        working-directory: sources/it.mangaworld
        run: aidoku package
      - name: Build personal source list
        run: aidoku build sources/it.mangaworld/package.aix --name "Personal MangaWorld"
      - name: Fix personal website links
        run: |
          sed -i 's|https://aidoku-community.github.io/sources/|https://alexert97.github.io/sources-aidoku/|g; s|https://github.com/aidoku-community/sources|https://github.com/Alexert97/sources-aidoku|g; s|Aidoku Community Sources|Personal MangaWorld|g' public/index.html
      - name: Verify package
        run: aidoku verify sources/it.mangaworld/package.aix
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: mangaworld-v9
          path: sources/it.mangaworld/package.aix
          if-no-files-found: error
      - name: Publish source list
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: public
          single-commit: true
