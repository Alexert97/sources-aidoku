name: Build personal MangaWorld
on:
  push:
    branches:
      - personal-mangaworld-v7
  workflow_dispatch:

concurrency:
  group: personal-mangaworld
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: JSON formatting
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            jq empty "$file"
            if [[ -s "$file" && -n "$(tail -c 1 "$file")" ]]; then
              echo "::error file=$file::Missing final newline"
              exit 1
            fi
            if grep -nE $'^\t* +' "$file"; then
              echo "::error file=$file::Use tabs for indentation"
              exit 1
            fi
          done < <(find sources/it.mangaworld/res -type f -name '*.json' -print0)
      - name: Rust formatting and Clippy
        run: |
          set -euo pipefail
          for crate in sources/it.mangaworld templates/mangaworld; do
            (
              cd "$crate"
              cargo fmt
              cargo fmt --check
              cargo clippy --target wasm32-unknown-unknown -- -D warnings
            )
          done
      - name: Save formatting changes for final commit
        if: always()
        run: git diff -- sources/it.mangaworld templates/mangaworld > "${RUNNER_TEMP}/mangaworld-format.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mangaworld-format-patch
          path: ${{ runner.temp }}/mangaworld-format.patch
      - name: Check MangaWorld availability with retries
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error
          urls = ["https://www.mangaworld.me/", "https://www.mangaworld.me/archive?page=1"]
          for attempt in range(1, 5):
              try:
                  for url in urls:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          body = response.read().decode("utf-8", "replace")
                          if response.status != 200 or "/manga/" not in body:
                              raise RuntimeError("HTTP response does not contain manga links")
                          print(f"HTTP {response.status}: {url}")
                  break
              except (OSError, RuntimeError) as exc:
                  print(f"Attempt {attempt}/4: {exc}", flush=True)
                  if attempt == 4:
                      raise SystemExit("MangaWorld unavailable: live tests cannot be verified")
                  time.sleep(30 * attempt)
          PY
      - uses: ./.github/actions/install-aidoku-cli
        id: aidoku
      - name: Install native test runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libssl-dev libclang-dev
          pkg-config --modversion fontconfig
      - name: Cache Aidoku test runner
        id: test-runner-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/aidoku-test-runner
          key: aidoku-test-runner-${{ runner.os }}-${{ runner.arch }}-${{ steps.aidoku.outputs.revision }}-rust1.99.0
      - name: Install Aidoku test runner
        env:
          AIDOKU_REVISION: ${{ steps.aidoku.outputs.revision }}
        run: |
          if ! command -v aidoku-test-runner >/dev/null; then
            cargo install --git https://github.com/Aidoku/aidoku-rs --rev "$AIDOKU_REVISION" aidoku-test-runner
          fi
      - name: Save Aidoku test runner immediately
        if: steps.test-runner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/aidoku-test-runner
          key: aidoku-test-runner-${{ runner.os }}-${{ runner.arch }}-${{ steps.aidoku.outputs.revision }}-rust1.99.0
      - name: Run live integration tests
        working-directory: sources/it.mangaworld
        run: cargo test
      - name: Diagnose date markup if integration tests fail
        if: failure()
        run: |
          python3 - <<'PY'
          import urllib.request, re
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          base = "https://www.mangaworld.me/"
          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "replace")
          try:
              home = fetch(base)
              urls = list(dict.fromkeys(re.findall(r'href=["\']([^"\']*/manga/[^"\']+)["\']', home)))
              for url in urls[:3]:
                  if "/read/" in url:
                      continue
                  body = fetch(urljoin(base, url))
                  print("Date markup for", url)
                  for match in re.findall(r'<[^>]*(?:ch-date|chap-date|datetime|data-timestamp|data-date)[^>]*>[^<]{0,120}', body, flags=re.I)[:12]:
                      print(match[:500])
          except Exception as exc:
              print("Diagnostic unavailable:", exc)
          PY
      - name: Package MangaWorld
        env:
          RUSTFLAGS: -Dwarnings
        working-directory: sources/it.mangaworld
        run: aidoku package
      - name: Build personal source list
        run: aidoku build sources/it.mangaworld/package.aix --name "Personal MangaWorld"
      - name: Fix personal website links
        run: |
          sed -i 's|https://aidoku-community.github.io/sources/|https://alexert97.github.io/sources-aidoku/|g; s|https://github.com/aidoku-community/sources|https://github.com/Alexert97/sources-aidoku|g; s|Aidoku Community Sources|Personal MangaWorld|g' public/index.html
      - name: Verify package
        run: aidoku verify sources/it.mangaworld/package.aix
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: mangaworld-v10
          path: sources/it.mangaworld/package.aix
          if-no-files-found: error
      - name: Publish source list
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: public
          single-commit: true
